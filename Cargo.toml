[package]
name = "felgens"
version = "0.7.1"
edition = "2021"
description = "Bilibili live danmu websocket library"
license = "MIT"
documentation = "https://docs.rs/felgens"
homepage = "https://github.com/eatradish/felgens"
repository = "https://github.com/eatradish/felgens"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
faster-hex = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.19", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "time",
] }
tokio-tungstenite = { version = "0.30", features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
scroll = "0.13"
scroll_derive = "0.13"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "native-tls",
] }
brotli = "9"
log = "0.4"
thiserror = "2.0"
url = "2.3"
md-5 = "0.11"
urlencoding = "2"

[dev-dependencies]
owo-colors = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
cookie-scoop = "0.1"
